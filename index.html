<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />

    <!-- Default title — overridden per-route by SEO component -->
    <title>SJI — Simple Tools for the Web</title>
    <meta name="description" content="SJI is a collection of useful web tools including AI chatbots, temporary email, image and PDF utilities, time tools, URL shortening and more." />

    <!-- Canonical — overridden per-route -->
    <link rel="canonical" href="https://sji.one/" />

    <!-- Open Graph defaults -->
    <meta property="og:title" content="SJI — Simple Tools for the Web" />
    <meta property="og:description" content="SJI is a collection of useful web tools including AI chatbots, temporary email, image and PDF utilities, time tools, URL shortening and more." />
    <meta property="og:url" content="https://sji.one/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SJI" />
    <meta property="og:image" content="https://sji.one/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SJI — Simple Tools for the Web" />
    <meta name="twitter:description" content="SJI is a collection of useful web tools for everyday digital work." />
    <meta name="twitter:image" content="https://sji.one/og-image.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f0f12" />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sitemap reference -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
